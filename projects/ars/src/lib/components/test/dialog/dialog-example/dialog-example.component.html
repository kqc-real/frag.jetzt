<ars-style-typography-material>
  <ars-style-dialog-material>

    <ars-dialog-box-content-template (onCloseEmit)="onCloseEmit.emit();">
      <ng-container content>
        <h1 class="typo-main-h space-page-p">Hallo</h1>
        <p class="typo-page-p space-page-p">
          odpwa kdpoakwd paowkdpao wdkpaowdk paowdk apwod kapwodk apwodk apwodk apwod ka
          opawkd paowkd apowdk apwodkapwdokapwodk apwdokapwodkapwdo kapwodkapwodkapkowdk.
        </p>
      </ng-container>
      <div class="dialog-btn-wrp" footer>
        <button class="dialog-btn">ACCEPT</button>
        <button class="dialog-btn" (click)="onCloseEmit.emit();">CLOSE</button>
      </div>
    </ars-dialog-box-content-template>

  </ars-style-dialog-material>
</ars-style-typography-material>
