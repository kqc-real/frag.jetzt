<ars-style-typography-material>
  <ars-style-dialog-material>

    <ars-dialog-box-content (closeEmit)="closeEmit.emit();">
      <ng-container limbo>
        <p tabindex="0">Navigate with Tab. You can Close the Dialog by pressing Escape.</p>
      </ng-container>
      <ng-container header>
        <h1 class="dialog-title">Reset settings?</h1>
      </ng-container>
      <ng-container content>
        <p class="typo-page-p">
          This will reset your device to its default factory settings.
        </p>
      </ng-container>
      <div class="dialog-btn-wrp" footer>
        <button class="dialog-btn"><p>CANCEL</p></button>
        <button class="dialog-btn" (click)="closeEmit.emit();"><p>ACCEPT</p></button>
      </div>
    </ars-dialog-box-content>

  </ars-style-dialog-material>
</ars-style-typography-material>
