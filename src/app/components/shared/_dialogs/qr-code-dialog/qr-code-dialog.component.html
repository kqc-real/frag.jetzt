<ars-screen>
  <div class="qr_content" #imageWrapper>
    <ngx-qrcode></ngx-qrcode>
  </div>
  <div class="qr_header">
    <button mat-icon-button (click)="close();">
      <mat-icon>close</mat-icon>
    </button>
    <h2 style="color: black!important;padding-left: 16px">URL: <a href="{{qrCode}}">{{qrCode}}</a>
      <br>Session-ID: {{qrCode.substring(28, 32)}} {{qrCode.substring(32, 36)}}</h2>
  </div>
</ars-screen>
